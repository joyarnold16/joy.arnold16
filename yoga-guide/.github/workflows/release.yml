name: Release AAB

# Manual only. Produces the signed Android App Bundle for a Play submission.
#
# Required repository secrets:
#   RELEASE_KEYSTORE_BASE64   base64 of app/release.keystore
#   RELEASE_STORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
#
# Produce the base64 with:
#   base64 -w0 app/release.keystore
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A broken content file must never reach a store submission.
      - name: Validate pose and condition data
        run: node tools/validate-content.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 is not set - the bundle would be unsigned." >&2
            exit 1
          fi
          # tr -d: a secret pasted through a browser form easily picks up
          # newlines, which base64 -d then rejects.
          printf '%s' "$KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > app/release.keystore
          echo "keystore is $(stat -c%s app/release.keystore) bytes"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13 --no-daemon

      - name: Build release bundle
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: yoga-guide-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f app/release.keystore
