name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# action-gh-release creates a GitHub Release with the default token.
# Without contents:write it fails with a 403 on the first run.
permissions:
  contents: write

jobs:
  # Cheap, dependency-free, and catches the entire class of silent content bugs
  # (a session naming a pose that does not exist, a contraindication naming a
  # flag that is not real). Runs first because it takes about a second.
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pose and condition data
        run: node tools/validate-content.js

  # Drives the actual UI in Chromium. Deliberately not a dependency of the build
  # job: a browser-download failure should not stop a phone-triggered APK.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run the end-to-end smoke test
        run: node tools/smoke.js
      - name: Render the figure contact sheet
        run: node tools/figure-sheet.js
      - name: Upload the contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: figure-sheet
          path: tools/shots/figures.png
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    needs: content
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Generate the wrapper in CI so the repo stays text-only (no committed
      # gradle-wrapper.jar), while the build still runs through ./gradlew.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13 --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stamp a unique release tag
        id: stamp
        run: echo "tag=build-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoga-guide-${{ steps.stamp.outputs.tag }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stamp.outputs.tag }}
          name: Yoga Guide ${{ steps.stamp.outputs.tag }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
