name: Build Release AAB

# Manual only - unlike build.yml this needs the signing secrets below to be
# configured first (repo Settings -> Secrets and variables -> Actions):
#   RELEASE_KEYSTORE_BASE64  - `base64 -w0 app/release.keystore`
#   RELEASE_STORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13 --no-daemon

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Debug signing inputs (temporary)
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          echo "RELEASE_KEY_ALIAS byte length: $(printf '%s' "$RELEASE_KEY_ALIAS" | wc -c)"
          echo "RELEASE_KEY_ALIAS hex dump:"
          printf '%s' "$RELEASE_KEY_ALIAS" | od -c | head -5
          echo "Aliases actually in the keystore:"
          keytool -list -keystore app/release.keystore -storepass "$RELEASE_STORE_PASSWORD" || true

      - name: Build signed release AAB
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: blastgrid-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove decoded keystore
        if: always()
        run: rm -f app/release.keystore
