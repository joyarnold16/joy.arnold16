name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# action-gh-release creates a GitHub Release with the default token.
# Without contents:write it fails with a 403 on the first run.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Generate the wrapper in CI so the repo stays text-only (no committed
      # gradle-wrapper.jar), while the build itself runs through the standard
      # ./gradlew path rather than a bare 'gradle' invocation.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2 --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stamp a unique release tag
        id: stamp
        run: echo "tag=build-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blastgrid-${{ steps.stamp.outputs.tag }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stamp.outputs.tag }}
          name: Blastgrid ${{ steps.stamp.outputs.tag }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
