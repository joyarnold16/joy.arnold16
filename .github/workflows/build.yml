name: Build Nanu APK v11

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Download Trust Wallet Core AAR
        run: |
          mkdir -p app/libs
          # Try GitHub releases first
          curl -fL -o app/libs/wallet-core.aar \
            "https://github.com/trustwallet/wallet-core/releases/download/4.0.26/wallet-core-android.aar" || \
          curl -fL -o app/libs/wallet-core.aar \
            "https://github.com/trustwallet/wallet-core/releases/download/4.0.26/android.aar" || \
          curl -fL -o app/libs/wallet-core.aar \
            "https://github.com/trustwallet/wallet-core/releases/download/4.0.26/wallet-core-release.aar" || true
          ls -lh app/libs/ || true

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          JAVA_OPTS: "-Xmx4g"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: nanu-ai-v11-signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 30

      - name: Upload unsigned APK (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanu-ai-v11-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
