name: Build Nanu APK v11

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Release APK + AAB
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace
        env:
          JAVA_OPTS: "-Xmx4g"

      - name: Sign APK
        id: sign_app
        continue-on-error: true
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Sign AAB (Play Store upload bundle)
        id: sign_aab
        continue-on-error: true
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename APK for release
        if: steps.sign_app.outcome == 'success'
        run: cp "${{ steps.sign_app.outputs.signedReleaseFile }}" nanu-ai-trading-bot.apk

      - name: Rename AAB for release
        if: steps.sign_aab.outcome == 'success'
        run: cp "${{ steps.sign_aab.outputs.signedReleaseFile }}" nanu-ai-trading-bot.aab

      - name: Publish GitHub Release with direct APK + AAB
        if: steps.sign_app.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Nanu AI Trading Bot
          body: "Latest build — tap nanu-ai-trading-bot.apk to install directly, or upload nanu-ai-trading-bot.aab to Google Play Console"
          files: |
            nanu-ai-trading-bot.apk
            nanu-ai-trading-bot.aab
          prerelease: false
