name: Yoga Guide

# Yoga Guide is a self-contained Gradle project under yoga-guide/, kept that way
# so it can be lifted into its own repository verbatim. It carries its own
# workflows at yoga-guide/.github/workflows/, but GitHub only reads workflows
# from the repository root - so those stay dormant until the move happens.
#
# This file is the stand-in that makes them run while the project lives here.
# Delete it when yoga-guide/ moves out; the nested workflows take over intact.

on:
  push:
    branches: [ main ]
    paths: [ 'yoga-guide/**', '.github/workflows/yoga-guide.yml' ]
  pull_request:
    paths: [ 'yoga-guide/**', '.github/workflows/yoga-guide.yml' ]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: yoga-guide

jobs:
  # Dependency-free and about a second. Catches the entire class of silent
  # content bugs: a session naming a pose that does not exist, a
  # contraindication naming a health flag that is not in the vocabulary, a
  # substitute pose that shares every restriction with the pose it replaces.
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pose and condition data
        run: node tools/validate-content.js

  # Drives the real UI in Chromium: completes onboarding as a pregnant user with
  # high blood pressure, then asserts no contraindicated pose survives any
  # session and no advanced pose reaches a beginner.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run the end-to-end smoke test
        run: node tools/smoke.js
      - name: Render the figure contact sheet
        run: node tools/figure-sheet.js
      - name: Upload the contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: yoga-guide-figure-sheet
          path: yoga-guide/tools/shots/figures.png
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    needs: content
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Generated in CI so the repo stays text-only - no committed wrapper jar.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13 --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoga-guide-debug-apk
          path: yoga-guide/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
