plugins {
    id 'com.android.application'
}

android {
    compileSdk 35
    namespace 'com.nanu.aitradingbot'

    defaultConfig {
        applicationId "com.nanu.aitradingbot"
        minSdk 24
        targetSdk 35
        versionCode 37
        versionName "11.1-nanu"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/NOTICE.md'
        pickFirst 'META-INF/*.kotlin_module'
        pickFirst 'META-INF/BCKEY.DSA'
        pickFirst 'META-INF/BCKEY.SF'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Wallet: BIP39 + BIP32 + Ethereum signing
    implementation('org.web3j:crypto:4.9.8') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    }
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'

    // Solana: ed25519 signing
    implementation 'net.i2p.crypto:eddsa:0.3.0'

    // QR code generate
    implementation 'com.google.zxing:core:3.5.3'
}
