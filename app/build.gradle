plugins {
    id 'com.android.application'
}

// Release signing reads from app/release.keystore + keystore.properties, both
// git-ignored - never commit the actual keystore or passwords to this public
// repo. Locally: drop release.keystore here and a keystore.properties (see
// keystore.properties.example) at the repo root. In CI: the release workflow
// decodes a base64 secret into release.keystore and passes the rest as env vars.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def releaseStoreFile = file('release.keystore')

android {
    namespace 'com.joy.blastgrid'
    // 36 (Android 16): Play requires this for new-app submissions from
    // Aug 31 2026 - close enough that a first submission today could easily
    // land after the deadline once the mandatory closed-testing period runs.
    compileSdk 36

    defaultConfig {
        applicationId "com.joy.blastgrid"
        // 26 keeps the launcher icon vector-only (adaptive icons land in API 26).
        // Drop to 24 only if you add PNG mipmaps.
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (releaseStoreFile.exists()) {
                storeFile releaseStoreFile
                // .trim(): CI secrets pasted through a browser form easily pick up a
                // stray trailing space/newline, which keytool then treats as part of
                // the value and fails to match - trimming makes that class of typo
                // harmless instead of a cryptic "no key with alias" build failure.
                storePassword keystoreProps.getProperty('storePassword', System.getenv('RELEASE_STORE_PASSWORD'))?.trim()
                keyAlias keystoreProps.getProperty('keyAlias', System.getenv('RELEASE_KEY_ALIAS'))?.trim()
                keyPassword keystoreProps.getProperty('keyPassword', System.getenv('RELEASE_KEY_PASSWORD'))?.trim()
            }
        }
    }

    buildTypes {
        release {
            // Unsigned (and un-uploadable to Play) until release.keystore is
            // supplied - see the comment above signingConfigs.
            if (releaseStoreFile.exists()) signingConfig signingConfigs.release
            // Nothing here is reflection- or JNI-backed, so there is nothing for R8
            // to strip incorrectly. Left off anyway: the app is one HTML asset,
            // and shrinking buys almost nothing while risking a silent breakage.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module']
        }
    }

    // The HTML is already minified enough by hand; do not let aapt touch it.
    androidResources {
        noCompress 'html'
    }

    lint {
        lintConfig file('lint.xml')
        // A warning should never block a phone-triggered CI build.
        abortOnError false
        checkReleaseBuilds false
    }
}

configurations.all {
    resolutionStrategy {
        // AndroidX transitively pulls both kotlin-stdlib:1.8.22 and an older
        // kotlin-stdlib-jdk7/jdk8:1.6.21, whose classes got merged into
        // kotlin-stdlib in 1.8 - forcing a single version avoids the overlap.
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Explicit rather than relying on appcompat's transitive pull, so the
    // WindowCompat / insets imports can't break on an appcompat bump.
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    // WebViewAssetLoader: serves assets over a virtual https origin so
    // localStorage behaves, instead of the opaque origin you get with file://
    implementation 'androidx.webkit:webkit:1.12.1'
    // GMA Next-Gen SDK for interstitial ads between runs. Deliberately the
    // Next-Gen artifact, not the legacy com.google.android.gms:play-services-ads -
    // Google put that one in maintenance mode in favor of this as of mid-2026.
    implementation 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.4.0'
}
