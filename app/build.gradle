plugins {
    id 'com.android.application'
}

android {
    compileSdk 35
    namespace 'com.nanu.aitradingbot'

    defaultConfig {
        applicationId "com.nanu.aitradingbot"
        minSdk 23
        targetSdk 35
        versionCode 36
        versionName "11.0-nanu"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        pickFirst 'lib/armeabi-v7a/libTrustWalletCore.so'
        pickFirst 'lib/arm64-v8a/libTrustWalletCore.so'
        pickFirst 'lib/x86/libTrustWalletCore.so'
        pickFirst 'lib/x86_64/libTrustWalletCore.so'
        pickFirst 'META-INF/DEPENDENCIES'
        pickFirst 'META-INF/LICENSE'
        pickFirst 'META-INF/NOTICE'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Trust Wallet Core - try Maven first, fall back to local AAR
    if (new File("${projectDir}/libs/wallet-core.aar").exists()) {
        implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    } else {
        implementation 'com.trustwallet:wallet-core:4.0.26'
    }

    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.protobuf:protobuf-javalite:3.25.3'

    // Web3j for Ethereum/BNB signing (backup)
    implementation 'org.web3j:crypto:4.9.8'
}
